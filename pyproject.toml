[project]
name = "research-template"
version = "0.1.0"
description = "Reproducible experiments for vision, language, tabular, multimodal, and scientific research"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
vision = ["torch>=2.5,<3", "torchvision>=0.20,<1", "timm>=1,<2", "pillow>=10,<13", "albumentations>=2,<3"]
llm = ["torch>=2.5,<3", "transformers>=4.50,<6", "datasets>=3,<5", "accelerate>=1,<2", "peft>=0.15,<1", "sentencepiece>=0.2,<1", "safetensors>=0.5,<1"]
tabular = ["xgboost>=2.1,<4", "lightgbm>=4.5,<5", "catboost>=1.2.7,<2", "optuna>=4,<5", "shap>=0.46,<1", "imbalanced-learn>=0.13,<1"]
multimodal = ["research-template[vision,llm]"]
scientific = ["scipy>=1.14,<2", "sympy>=1.13,<2", "xarray>=2024.10", "h5py>=3.12,<4"]
tracking = ["mlflow>=2.20,<4", "wandb>=0.19,<1"]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "matplotlib>=3.9,<4", "seaborn>=0.13,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
research = "research_template.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_template"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
