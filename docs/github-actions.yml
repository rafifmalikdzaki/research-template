# To activate: copy to .github/workflows/ci.yml and push with workflow permission.
name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.7.13'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync research demo
      - run: uv build
  modalities:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.7.13'
          python-version: '3.11'
      - run: uv sync --locked --extra multimodal --extra scientific
      - run: uv run --no-sync python examples/modality_smoke.py vision
      - run: uv run --no-sync python examples/modality_smoke.py llm
      - run: uv run --no-sync python examples/modality_smoke.py multimodal
      - run: uv run --no-sync python examples/modality_smoke.py scientific
